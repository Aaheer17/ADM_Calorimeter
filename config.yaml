base_dir: /project/biocomplexity/fa7sa/Diffusion_multi_step/autoregressive-diffusion-pytorch/
val_frac: 0.10
eps: 1.0e-10
particle_type: electron
eval_dataset: "2"
shape: [45]
base_dir: /project/biocomplexity/fa7sa/Diffusion_multi_step/autoregressive-diffusion-pytorch
# Preprocessing
transforms:
    #ScaleVoxels:
    #    factor: 0.35
    NormalizeByElayer:
        ptype: /remote/gpu02/ore/calo_dreamer/src/challenge_files/binning_dataset_2.xml
        xml_file: electron
    ScaleTotalEnergy: 
        factor: 0.35
    SelectDims:
        start: -45
        end: 0
    ExclusiveLogitTransform:
        delta: 1.0e-6
        rescale: True
    StandardizeFromFile: {}
    LogEnergy: {}
    ScaleEnergy:
        e_min: 6.907755
        e_max: 13.815510
    Reshape:
        shape: [45, 1]
        
