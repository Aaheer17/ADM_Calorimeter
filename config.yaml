#encode_c_dim: 64
n_con: 1
conditional: True
#c_embed: True
#x_embed: True
#conditional: True
#encode_t: True
#encode_t_dim: 64
#encode_c: True
normalization: LayerNorm

#arguments for Diffusion for energy network
emd_dim: 64 # time and conditional embedding size
lr: 5.e-3
max_lr: 2.e-3
epochs: 1



#validation
do_validation: True


#sampling
n_samples: 1000
